name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          # Integration tests boot the real Program.cs; supply the same config
          # keys the app reads at startup. Values are throwaway — the test
          # factory swaps the DbContext for InMemory before any request runs.
          Jwt__Key: ci-only-signing-key-not-used-in-prod-0123456789abcdef
          Jwt__Issuer: WorkCale.Api
          Jwt__Audience: WorkCale.Client
          Jwt__ExpirationMinutes: "60"
          ConnectionStrings__Database: Host=localhost;Database=ignored;Username=ignored;Password=ignored
        run: |
          dotnet test --configuration Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 14

      - name: Test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: dotnet tests
          path: ./TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
